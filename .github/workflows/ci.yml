name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: gsap/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: gsap
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        working-directory: gsap
        run: pnpm lint

      - name: Build Next.js
        working-directory: gsap
        run: pnpm build

      - name: Build Docker image
        working-directory: gsap
        run: docker build -t gsap-app:ci .

      - name: Run Docker container
        run: docker run -d --name gsap-test -p 3000:3000 gsap-app:ci

      - name: Wait for application
        run: sleep 10

      - name: Test application
        run: curl --fail http://localhost:3000

      - name: Stop Docker container
        if: always()
        run: docker rm -f gsap-test